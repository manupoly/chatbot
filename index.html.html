<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot — Assistente Cartão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #wrapper {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      padding-left: 4px;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 580px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    }

    /* HEADER */
    #chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #e8edf2;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #dcfce7;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .avatar i { font-size: 18px; color: #15803d; }
    .hdr-info .name { font-size: 15px; font-weight: 600; color: #0f172a; }
    .hdr-info .status {
      font-size: 12px; color: #22c55e;
      display: flex; align-items: center; gap: 4px;
    }
    .hdr-info .status::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; display: inline-block;
    }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

    .msg { display: flex; gap: 8px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #0f172a;
    }
    .msg.bot .bubble {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #166534;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-icon {
      width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
      background: #dcfce7;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
    }
    .bot-icon i { font-size: 15px; color: #15803d; }

    /* META BADGES */
    .meta {
      display: flex; align-items: center; gap: 6px;
      margin-top: 7px; flex-wrap: wrap;
    }
    .tag-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 99px;
      background: #dcfce7; color: #15803d;
      border: 1px solid #86efac;
    }
    .conf-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
      padding: 3px 10px; border-radius: 99px;
      background: #f1f5f9; color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .prob-bar-wrap {
      display: flex; align-items: center; gap: 8px;
      margin-top: 5px;
    }
    .prob-bar-bg {
      flex: 1; height: 3px; border-radius: 2px;
      background: #e2e8f0; overflow: hidden;
    }
    .prob-bar-fill {
      height: 100%; border-radius: 2px;
      background: #22c55e;
      transition: width 0.5s ease;
    }
    .prob-label { font-size: 11px; color: #94a3b8; white-space: nowrap; }

    /* QUICK CHIPS */
    .quick-chips {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 14px;
      background: #ffffff;
      border-top: 1px solid #e8edf2;
    }
    .chip {
      font-size: 12px; padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #374151;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .chip:hover {
      background: #dcfce7;
      border-color: #86efac;
      color: #15803d;
    }

    /* INPUT AREA */
    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #e8edf2;
      display: flex; gap: 8px; align-items: flex-end;
      background: #ffffff;
    }
    #user-input {
      flex: 1; padding: 10px 14px; font-size: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #0f172a;
      font-family: inherit;
      resize: none;
      min-height: 40px; max-height: 96px;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
    }
    #user-input:focus {
      outline: none;
      border-color: #22c55e;
      background: #ffffff;
    }
    #user-input::placeholder { color: #9ca3af; }

    #send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: #16a34a; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: #15803d; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn i { font-size: 18px; color: #fff; }
    #send-btn:disabled { background: #d1d5db; cursor: not-allowed; }

    /* TYPING */
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #94a3b8;
      animation: blink 1.3s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>

  ["Conta","Como acessar minha conta?","Use login no app."],
  ["Conta","Esqueci meu login","Recupere pelo app."],
  ["Conta","App não está funcionando","Tente atualizar ou reinstalar."],
  ["Conta","Como atualizar meus dados?","No app."],
  ["Conta","Posso acessar pelo site?","Sim."],
  ["Conta","Como ativar notificações?","No app."],
  ["Conta","Meu app travou","Reinicie."],
  ["Conta","Como sair da conta?","No app."],
  ["Conta","Posso ter mais de um login?","Depende."],
  ["Conta","Como excluir minha conta?","Solicite atendimento."],
  ["Conta","Dados não atualizam","Tente novamente."],
  ["Conta","Como ativar reconhecimento facial?","No app."],
  ["Conta","Posso acessar em outro celular?","Sim."],
  ["Conta","Como sincronizar dados?","Automaticamente."],
  ["Conta","Como falar com atendimento?","Pelo app ou telefone."],
];

const catIcons = {
  Fatura:"ti-file-invoice", Limite:"ti-trending-up", Bloqueio:"ti-lock",
  Cancelamento:"ti-x", Parcelamento:"ti-calendar-due", Senha:"ti-key",
  Cartão:"ti-credit-card", Compras:"ti-shopping-cart", Conta:"ti-user"
};

function norm(t) {
  return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function tok(t) { return norm(t).split(' ').filter(w => w.length > 1); }

function buildVocab(docs) {
  const v = {}; let i = 0;
  docs.forEach(d => tok(d).forEach(w => { if (!(w in v)) v[w] = i++; }));
  return v;
}

function vecDoc(text, vocab) {
  const V = Object.keys(vocab).length, a = new Float32Array(V);
  tok(text).forEach(w => { if (w in vocab) a[vocab[w]]++; });
  return a;
}

class NB {
  fit(docs, labels) {
    this.cls = [...new Set(labels)];
    this.vocab = buildVocab(docs);
    const V = Object.keys(this.vocab).length;
    this.prior = {}; this.ll = {};
    this.cls.forEach(c => {
      const idx = labels.map((l,i) => l===c ? i : -1).filter(i => i >= 0);
      this.prior[c] = Math.log(idx.length / docs.length);
      const wc = new Float32Array(V);
      idx.forEach(i => { const v2 = vecDoc(docs[i], this.vocab); for (let j=0;j<V;j++) wc[j]+=v2[j]; });
      const tot = wc.reduce((a,b) => a+b, 0);
      this.ll[c] = Array.from(wc).map(w => Math.log((w+1)/(tot+V)));
    });
  }
  predict(text) {
    const v2 = vecDoc(text, this.vocab);
    let best = null, bestS = -Infinity; const sc = {};
    this.cls.forEach(c => {
      let s = this.prior[c];
      for (let j=0;j<v2.length;j++) if(v2[j]>0) s += this.ll[c][j]*v2[j];
      sc[c] = s; if(s > bestS) { bestS = s; best = c; }
    });
    const mx = Math.max(...Object.values(sc));
    let sumE = 0; const ex = {};
    this.cls.forEach(c => { ex[c] = Math.exp(sc[c]-mx); sumE += ex[c]; });
    const pr = {}; this.cls.forEach(c => pr[c] = ex[c]/sumE);
    return { cat: best, prob: pr[best] };
  }
}

function cosineSim(a, b) {
  let dot=0, na=0, nb=0;
  for(let i=0;i<a.length;i++) { dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  return na&&nb ? dot/Math.sqrt(na*nb) : 0;
}

const model = new NB();
model.fit(KB.map(r => r[1]), KB.map(r => r[0]));

function findBest(query) {
  const cat = model.predict(query);
  if (cat.prob < 0.35) return null;
  const qv = vecDoc(query, model.vocab);
  let bestSim = -1, bestIdx = -1;
  KB.forEach(([c,,], i) => {
    if (c !== cat.cat) return;
    const s = cosineSim(qv, vecDoc(KB[i][1], model.vocab));
    if (s > bestSim) { bestSim = s; bestIdx = i; }
  });
  return bestIdx >= 0 ? { entry: KB[bestIdx], catProb: cat.prob, sim: bestSim } : null;
}

const msgsEl = document.getElementById('messages');
const inp = document.getElementById('user-input');
const btn = document.getElementById('send-btn');

function addMsg(text, type, meta=null) {
  const w = document.createElement('div');
  w.className = `msg ${type}`;
  if (type === 'bot') {
    const icon = document.createElement('div');
    icon.className = 'bot-icon';
    icon.innerHTML = '<i class="ti ti-credit-card"></i>';
    const body = document.createElement('div');
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    body.appendChild(b);
    if (meta) {
      const mr = document.createElement('div');
      mr.className = 'meta';
      mr.innerHTML = `<span class="tag-badge"><i class="ti ${catIcons[meta.cat]||'ti-tag'}"></i> ${meta.cat}</span><span class="conf-badge"><i class="ti ti-sparkles"></i> ${Math.round(meta.catProb*100)}% confiança</span>`;
      body.appendChild(mr);
      const pw = document.createElement('div');
      pw.className = 'prob-bar-wrap';
      const pct = Math.round(meta.catProb*100);
      pw.innerHTML = `<div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${pct}%"></div></div><span class="prob-label">similaridade ${Math.round(meta.sim*100)}%</span>`;
      body.appendChild(pw);
    }
    w.appendChild(icon); w.appendChild(body);
  } else {
    w.innerHTML = `<div class="bubble">${text}</div>`;
  }
  msgsEl.appendChild(w);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'msg bot'; t.id = 'typ';
  t.innerHTML = '<div class="bot-icon"><i class="ti ti-credit-card"></i></div><div class="bubble" style="display:flex;gap:5px;align-items:center"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  msgsEl.appendChild(t); msgsEl.scrollTop = msgsEl.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typ'); if(t) t.remove(); }

function respond(text) {
  btn.disabled = true; addTyping();
  setTimeout(() => {
    removeTyping();
    const res = findBest(text);
    if (!res) {
      addMsg('Desculpe, não entendi sua solicitação. Pode reformular a pergunta?', 'bot');
    } else {
      addMsg(res.entry[2], 'bot', { cat: res.entry[0], catProb: res.catProb, sim: res.sim });
    }
    btn.disabled = false;
  }, 500 + Math.random()*400);
}

function handleSend() {
  const t = inp.value.trim(); if (!t) return;
  addMsg(t, 'user'); inp.value = ''; inp.style.height = 'auto'; respond(t);
}
function sendChip(el) { addMsg(el.textContent, 'user'); respond(el.textContent); }

inp.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 96)+'px'; });

setTimeout(() => addMsg('Olá! Sou o assistente virtual do seu cartão. Como posso te ajudar hoje?', 'bot'), 300);
</script>
